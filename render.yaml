services:
  - type: web
    name: campus-intel
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CAMPUS_NAME
        value: Northstar Institute of Technology
      - key: DATABASE_PATH
        value: /tmp/campus.db
      - key: DATA_MODE
        value: mock
      - key: ADMIN_API_KEY
        generateValue: true
